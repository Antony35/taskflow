# https://nginx.org/en/docs/beginners_guide.html
# Image Docker (conf.d/default.conf, dossier html) : https://hub.docker.com/_/nginx
server {
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#listen
    listen 80;
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#root
    root /usr/share/nginx/html;

    # Relais vers l'API : sans chemin après le port, le préfixe /api est conservé
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#location
    # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
    location /api/ {
        proxy_pass http://api:3000;
        # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_set_header
        # $host : https://nginx.org/en/docs/http/ngx_http_core_module.html#variables
        # $proxy_add_x_forwarded_for : https://nginx.org/en/docs/http/ngx_http_proxy_module.html#variables
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mode history de Vue Router : toute route inconnue renvoie index.html
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
