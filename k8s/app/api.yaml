apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: antony35/taskflow-api:1.0.0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_PORT
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - containerPort: 3000
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

---

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: api
  ports:
    - protocol: TCP
      port: 3000

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
data:
  DB_USER: "taskflow"
  DB_NAME: "taskflow"
  DB_PORT: "5432"
  DB_HOST: "db"
  APP_ENV: "kubernetes"
