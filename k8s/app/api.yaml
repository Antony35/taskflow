apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: antony35/taskflow-api:1.0.0
          env:
            - name: DB_PASSWORD
              value: test
            - name: DB_USER
              value: taskflow
            - name: DB_NAME
              value: taskflow
            - name: DB_PORT
              value: '5432'
            - name: DB_HOST
              value: db
          ports:
            - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: api
  ports:
    - protocol: TCP
      port: 3000
