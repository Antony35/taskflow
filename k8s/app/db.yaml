apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: db
          image: postgres:18.6-alpine3.24
          env:
            - name: POSTGRES_PASSWORD
              value: test
            - name: POSTGRES_USER
              value: taskflow
            - name: POSTGRES_DB
              value: taskflow
          ports:
            - containerPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: db
  ports:
    - protocol: TCP
      port: 5432
