apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  serviceName: db-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: db
          image: postgres:18.6-alpine3.24
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          envFrom:
            - configMapRef:
                name: db-config
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: taskflow
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: db
  ports:
    - protocol: TCP
      port: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: db
  ports:
    - protocol: TCP
      port: 5432

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
data:
  POSTGRES_USER: "taskflow"
  POSTGRES_DB: "taskflow"
